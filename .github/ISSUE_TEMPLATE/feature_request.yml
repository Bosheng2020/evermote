name: Feature request
description: Propose an independently designed improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before the solution. Features involving identity, memory, schedules, sensors, executable tools, or external actions must define authority, approval, revocation, receipts, data lifecycle, and threat-model changes.

  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who needs this, and what can they not do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the interaction and its smallest useful form.
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Capability category
      options:
        - Local UI only
        - Model or agent behavior
        - Authentication or session authorization
        - Current-thread state or approval
        - Provider or hosting
        - External read integration
        - External write action
        - Schedule or proactive behavior
        - Personal memory
        - Sensor, audio, camera, location, or desktop access
    validations:
      required: true

  - type: textarea
    id: data
    attributes:
      label: Data and permissions
      description: What data crosses which boundary? How does the user grant, inspect, revoke, and delete it?
    validations:
      required: true

  - type: textarea
    id: authority
    attributes:
      label: Authority and control
      description: What can change, who initiates it, which deterministic control enforces approval, and what happens on denial, failure, retry, and revocation?
    validations:
      required: true

  - type: textarea
    id: evaluation
    attributes:
      label: Evaluation plan
      description: Separate deterministic tests, model behavioral evals, operator-configuration tests, and manual review.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true

  - type: textarea
    id: independence
    attributes:
      label: Independent design
      description: Explain how this stays original and avoids proprietary assets, private APIs, or confusing branding.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the roadmap.
          required: true
        - label: I am not proposing copied assets, proprietary code, or a reverse-engineered private API.
          required: true
        - label: I will update the capability contract, data map, evaluation guide, and threat model if this changes a boundary.
          required: true
